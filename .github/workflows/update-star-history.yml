name: Update GitHub star history

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read current star count and generate chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stars="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.stargazers_count')"
          node scripts/update-star-history.mjs "$(date -u +%F)" "$stars"

      - name: Commit updated chart
        run: |
          if git diff --quiet -- docs/data/stars.json docs/assets/stars.svg; then
            echo "Star history is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/stars.json docs/assets/stars.svg
          git commit -m "chore: update GitHub star history"
          git push
